[package]
name = "nixos-needsreboot"
version = "0.1.11"
edition = "2021"
description = "Determine if you need to reboot your NixOS machine"
license = "GPL-2.0"
repository = "https://github.com/thefossguy/nixos-reedsreboot"
readme = "README.md"
keywords = [ "nixos" ]
categories = [ "command-line-utilities" ]

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
wheel = { git = "https://github.com/fenhl/wheel" }
